[project]
name = "interpreter-workbench"
version = "0.1.0"
description = "Boostlingo AI Interpreter Workbench backend: Realtime secret minting + streaming cascade pipeline"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "websockets>=13",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]
eval = ["playwright>=1.45", "pyyaml>=6", "jiwer>=3", "sacrebleu>=2.4", "whisper-normalizer>=0.0.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: opt-in tests that call real provider APIs (skipped without keys)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 110
target-version = "py312"
