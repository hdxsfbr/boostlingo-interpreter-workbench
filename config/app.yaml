# Active providers and model ids. Model ids live ONLY here (and env overrides),
# never in code. Env overrides: CASCADE_STT, CASCADE_MT, CASCADE_TTS, REALTIME_MODEL, MT_MODEL.
realtime:
  model: gpt-realtime-mini        # dev default; final runs use gpt-realtime (D5)
  transcription_model: gpt-4o-transcribe
  voice: marin
  secret_ttl_s: 600

cascade:
  stt: openai_live
  mt: openai
  tts: openai
  playback_policy: after_speech_end   # D8
  speculative_mt: true    # M4 (tail -0.3..-0.5 s, 0 misses): MT/TTS on the committed segment's partial transcript (env CASCADE_SPECULATIVE)
  speculative_with_elevenlabs: false   # A9: cancelled speculative runs would spend ElevenLabs credits
  merge_fragments: true   # M5: a short unpunctuated in-turn segment ("Do you have") is merged into the next (env CASCADE_MERGE_FRAGMENTS)
  chunker:                # SentenceChunker kwargs (env CHUNK_FIRST_CLAUSE_MIN / CHUNK_FIRST_WORD_MIN)
    first_clause_min: 25
    first_word_min: 20    # M4: first TTS chunk at a word boundary (~-100 ms on short turns)

providers:
  openai_live:
    model: gpt-live-transcribe
    delay: low            # M4: minimal is ~0.2 s faster with speculation but STT WER rose 2-3x (0.02-0.03 -> 0.05-0.07); env STT_DELAY=minimal
    languages: [en, es]
  openai:
    model: gpt-5.4-nano       # chosen by measured TTFT in M1 (see docs/benchmarks/mt-ttft.md)
    reasoning_effort: none
    max_output_tokens: 400
  anthropic:
    model: claude-haiku-5-5
    max_tokens: 400
    effort: low            # thinking disabled; allowed at effort <= high
    enabled: false         # live validity check returned 400 (2026-10-08); profile stays optional
  openrouter:             # OpenAI-compatible chat API, another base_url
    model: anthropic/claude-haiku-5.5   # canonical OpenRouter id (the M4 check sent -5-5 and was served 5.5)
    max_tokens: 400
    sort: latency
  openai_tts:
    model: gpt-4o-mini-tts
    voices: {en: marin, es: marin}
  elevenlabs:
    model: eleven_flash_v2_5
    session_char_cap: 1500
    month_char_cap: 8000
    prewarm: true          # pre-open one socket per target language between turns
    voices:                # premade multilingual voice (George); verify by ear at demo time
      en: JBFqnCBsd6RMkjVDRZzb
      es: JBFqnCBsd6RMkjVDRZzb

recording:                # A11: opt-in session audio recording (auditability); local only
  enabled: false          # env RECORDING_ENABLED=1; the UI toggle is disabled while false
  retention_days: 30      # files older than this are deleted on startup + periodic sweep
  sweep_interval_h: 6
  max_upload_mb: 20       # realtime per-turn browser uploads

experiments:              # A13: in-product experiment runner (Experiments tab)
  confirm_above_usd: 1.0  # estimated cost above this needs an explicit confirmation
  self_url: http://127.0.0.1:8740   # the harness drives this app from inside the container

timeouts_s:
  stt_final: 3
  mt_first_token: 3
  tts_first_byte: 3
  turn: 20
  connect: 5
  hedge_s: 1.5   # backup MT/TTS request if no first output by then (0 = off)
